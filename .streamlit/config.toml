# Pastel palette built on the project's three roles:
#   lavender = the Koopman model, coral = MRSA, mint = protection / the safe outcome.
# Cream and lavender surfaces in light mode, deep plum in dark. No `base`:
# follows the viewer's light/dark setting.
[theme]
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#7c6cf0"
backgroundColor = "#fbf8f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#2a2735"
borderColor = "#ece6ef"
linkColor = "#7c6cf0"

[theme.dark]
primaryColor = "#a99cff"
backgroundColor = "#16141d"
secondaryBackgroundColor = "#1d1a26"
textColor = "#ece9f5"
borderColor = "#2b2737"
linkColor = "#a99cff"

[theme.light.sidebar]
backgroundColor = "#f4effb"

[theme.dark.sidebar]
backgroundColor = "#1a1723"

[client]
toolbarMode = "minimal"      # no Deploy button or developer menu
showSidebarNavigation = false

[browser]
gatherUsageStats = false
