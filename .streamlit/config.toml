# Next.js-style neutrals; data colours (blue = Koopman, red = MRSA) live in the
# charts and the embedded scenes. No `base`: follows the viewer's light/dark setting.
[theme]
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#171717"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#ffffff"
textColor = "#171717"
borderColor = "#eaeaea"
linkColor = "#171717"

[theme.dark]
primaryColor = "#ededed"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
textColor = "#ededed"
borderColor = "#1f1f1f"
linkColor = "#ededed"

[theme.light.sidebar]
backgroundColor = "#ffffff"

[theme.dark.sidebar]
backgroundColor = "#0a0a0a"

[client]
toolbarMode = "minimal"      # no Deploy button or developer menu
showSidebarNavigation = false

[browser]
gatherUsageStats = false
